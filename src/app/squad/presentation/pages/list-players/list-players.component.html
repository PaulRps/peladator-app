<div class="container mx-auto">
  <div class="grid grid-cols-4 gap-1">
    <div class="col-start-1">
      <mat-form-field>
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Nome do jogador" #input />
      </mat-form-field>
    </div>
    <div class="col-start-4 col-end-5">
      <a mat-flat-button color="primary" aria-label="Adicionar jogador" extended routerLink="add">
        <mat-icon>add</mat-icon>
        Novo
      </a>
    </div>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="data" matSort>
      <!-- Progress Column -->
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Posição</th>
        <td mat-cell *matCellDef="let row">{{ row.position }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <!-- Fruit Column -->
      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nível</th>
        <td mat-cell *matCellDef="let row">{{ row.level }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">Nada para exibir"</td>
      </tr>
    </table>

    <!-- <mat-paginator
      (page)="handlePageEvent($event)"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of users"
    ></mat-paginator> -->
  </div>
</div>
