<div class="container mx-auto px-2">
  <div class="grid grid-cols-4 gap-1">
    <div class="col-start-1">
      <mat-form-field class="mr-4">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Nome do jogador" #input />
      </mat-form-field>
    </div>
    <div class="col-start-4 col-end-5 grid">
      <a mat-flat-button color="primary" class="justify-self-end" aria-label="Adicionar jogador" extended routerLink="add-player">
        <mat-icon>add</mat-icon>
        Jogador
      </a>
    </div>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="data" matSort>
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef>Posição</th>
        <td mat-cell *matCellDef="let row" (mouseout)="hideActions(row)" (mouseover)="showActions(row)">
          {{ row.position }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let row" (mouseout)="hideActions(row)" (mouseover)="showActions(row)">
          <div class="actions" *ngIf="row.hovered">
            <a mat-button color="accent" aria-label="escalar jogador" extended (click)="saveForFixture(row)">
              <mat-icon>how_to_reg</mat-icon>
              Escalar
            </a>
            <a
              mat-button
              color="primary"
              aria-label="atualizar jogador"
              extended
              routerLink="update-player/{{ row.id }}"
            >
              <mat-icon>edit</mat-icon>
              Editar
            </a>
            
            <a mat-button color="warn" aria-label="deletar jogador" extended (click)="delete(row)">
              <mat-icon>delete</mat-icon>
              Deletar
            </a>
          </div>
          {{ row.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef>Nível</th>
        <td mat-cell *matCellDef="let row" (mouseout)="hideActions(row)" (mouseover)="showActions(row)">
          {{ row.level }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">Nada para exibir"</td>
      </tr>
    </table>
  </div>
</div>
