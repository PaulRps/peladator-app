<mat-stepper orientation="vertical" [linear]="false" #stepper>
  <mat-step label="Selecione os jogadores com prioridade">
    <table mat-table [dataSource]="data" matSort>
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            (change)="$event ? toggleAllRows() : null"
            [checked]="selection.hasValue() && isAllSelected()"
            [indeterminate]="selection.hasValue() && !isAllSelected()"
          >
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox
            (click)="$event.stopPropagation()"
            (change)="$event ? selection.toggle(row) : null"
            [checked]="selection.isSelected(row)"
          >
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Progress Column -->
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Posição</th>
        <td mat-cell *matCellDef="let row">{{ row.position }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <!-- Fruit Column -->
      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nível</th>
        <td mat-cell *matCellDef="let row">{{ row.level }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <div>
      <mat-error *ngIf="hasReachedStepOne && !hasSelectedPlayers">Selecione jogadores</mat-error>
      <button mat-button (click)="next(stepper, 1)">Próximo</button>
    </div>
  </mat-step>
  <mat-step label="Defina a quantidade de jogadores por time">
    <form [formGroup]="fixtureFormGroup">
      <mat-form-field>
        <mat-label title="Qtd. Jogadores por time">Qtd. Jogadores por time</mat-label>
        <input matInput formControlName="amountPlayersInLineUp" placeholder="Ex. 8 Jogadores por time" required />
        <mat-error *ngIf="fixtureFormGroup.get('amountPlayersInLineUp')?.invalid">Campo obrigatório</mat-error>
      </mat-form-field>
      <div>
        <button mat-button matStepperPrevious>Voltar</button>
        <button
          mat-button
          [disabled]="!fixtureFormGroup.valid || this.selection.selected.length == 0"
          (click)="createFixture(stepper)"
        >
          Gerar times
        </button>
      </div>
    </form>
  </mat-step>
  <!-- <mat-step>
    <ng-template matStepLabel>Times Gerados</ng-template>
    <app-fixture [fixture]="fixture"></app-fixture>
  </mat-step> -->
</mat-stepper>
