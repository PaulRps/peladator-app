<p class="pb-6">Últimos Times Gerados</p>
<div *ngIf="fixture">
  <div *ngFor="let squad of fixture?.lineUps; index as i">
    <p>{{ 'Time ' + (i + 1) + ' (Nível=' + squad.level + ' Jogadores=' + squad.players?.length + ')' }}</p>
    <ul *ngFor="let player of squad.players">
      <li>
        Jogador: {{ player.name }} (Posição/Nível: {{ player.position }}/{{ player.level }}) - Ordem:
        {{ player.sequence }}
      </li>
    </ul>
  </div>
</div>
<div *ngIf="!fixture">Nada para exibir</div>
